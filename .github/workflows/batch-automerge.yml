# Speurtocht.NL - merge queue for translated batches.
#
# Runs tools/automerge.py, which takes every batch-NN branch that isn't on main yet
# (lowest number first) and, for each one: opens its pull request, syncs it with
# main, rebuilds the shared files (SpeurtochtNL.toc, Data/Namen.lua, CHANGELOG.md),
# runs the importer checks and the test harness, and merges it into main.
# A batch that fails gets one comment with the real error on its pull request and
# the queue moves on; nothing else is held up.
#
# Starts on every push to a batch-NN branch, every 30 minutes as a safety net
# (so nothing stays stuck if a run was skipped), and by hand from the Actions tab.
# Only one run at a time; since each run handles the whole queue, a run that
# GitHub drops from the waiting line loses nothing.
#
# Needs, once, in Settings > Actions > General > Workflow permissions:
#   "Read and write permissions" and
#   "Allow GitHub Actions to create and approve pull requests".

name: Batch auto-merge

on:
  push:
    branches: ["batch-*"]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: batch-automerge
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null

      - name: Merge every waiting batch
        run: python3 tools/automerge.py
